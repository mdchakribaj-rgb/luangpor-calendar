<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9973a">
<title>ลิงก์เชิญ — ปฏิทินหลวงพ่อ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0ebe0;--surface:#faf7f0;--border:#d4c9a8;--gold2:#c9973a;--brown:#3d2e10;--brown2:#6b5a3e;--text3:#9c8a68;--green:#3d6b35}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.card{background:var(--surface);border-radius:28px;border:1px solid var(--border);padding:36px 26px;width:390px;max-width:100%;text-align:center;box-shadow:0 8px 32px rgba(61,46,16,.1)}
.logo{width:96px;height:96px;border-radius:50%;background:#fff;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border:3px solid #e8c56a;box-shadow:0 4px 16px rgba(184,134,11,.25);overflow:hidden}
.logo img{width:86px;height:86px;object-fit:contain}
.app-name{font-size:22px;font-weight:800;color:var(--brown)}
.invitee{font-size:15px;color:var(--brown2);margin-top:6px}
.status{border-radius:12px;padding:16px;margin:20px 0;font-size:15px;line-height:1.7}
.s-wait{background:#fdf8ee;border:1px solid #e8d9a0;color:var(--brown2)}
.s-ok{background:#f0f8ee;border:1px solid #b8d4b0;color:#2a5024}
.s-err{background:#fdf0f0;border:1px solid #e8a0a0;color:#8b2020}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;display:none;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.btn-google{background:#3d3222;color:#e8c56a;box-shadow:0 3px 10px rgba(61,50,34,.25)}
.btn-google img{width:22px;height:22px}
.btn-go{background:var(--green);color:#fff}
.btn:disabled{opacity:.6}
.note{font-size:12px;color:var(--text3);margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt="" onerror="this.parentNode.textContent='🏛️'"></div>
  <div class="app-name">ปฏิทินหลวงพ่อ</div>
  <div class="invitee" id="invitee"></div>
  <div class="status s-wait" id="status">⏳ กำลังตรวจสอบลิงก์เชิญ...</div>
  <button class="btn btn-google" id="google-btn" onclick="loginGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    <span>เข้าสู่ระบบด้วย Google</span>
  </button>
  <button class="btn btn-go" id="go-btn" onclick="location.replace('index.html')">เข้าใช้งานปฏิทิน →</button>
  <div class="note" id="note">ใช้บัญชี Google ที่ต้องการใช้เข้าระบบเป็นประจำ<br>ลิงก์นี้ใช้ได้เพียงครั้งเดียว</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAZeMTn0aihwl_LaKJ7UHTDepEWtHkRauo",authDomain:"luangpor-calendar.firebaseapp.com",projectId:"luangpor-calendar",storageBucket:"luangpor-calendar.firebasestorage.app",messagingSenderId:"575348458305",appId:"1:575348458305:web:d7e43e154df855d54357c0"});
const auth=getAuth(app), db=getFirestore(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
const persistenceReady=setPersistence(auth,browserLocalPersistence).catch(()=>{});

const token=new URLSearchParams(location.search).get('token');
const st=document.getElementById('status'), gb=document.getElementById('google-btn'), go=document.getElementById('go-btn');
let invite=null, busy=false;

function show(cls,html){st.className='status '+cls;st.innerHTML=html;}
function err(msg){show('s-err','❌ '+msg);gb.disabled=false;busy=false;}

// เบราว์เซอร์ในแอพ LINE / Facebook — Google ไม่อนุญาตให้ล็อกอิน
function inAppBrowser(){return /Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);}

async function join(user){
  show('s-wait','⏳ กำลังบันทึกเข้าระบบ...');
  const email=user.email.toLowerCase();
  const exist=await getDoc(doc(db,'members',email));
  if(exist.exists()){
    show('s-ok','✅ บัญชีนี้เป็นสมาชิกอยู่แล้ว');
    gb.style.display='none'; go.style.display='flex'; return;
  }
  await setDoc(doc(db,'members',email),{
    name:(user.displayName||email.split('@')[0]).split(' ')[0],
    email, role:invite.role||'viewer', active:true,
    inviteToken:token, invitedBy:invite.createdBy||'',
    photoURL:user.photoURL||'', addedAt:serverTimestamp()
  });
  try{ await deleteDoc(doc(db,'invites',token)); }catch(e){ console.warn('delete invite:',e); }
  show('s-ok','🎉 เข้าร่วมสำเร็จ<br>ยินดีต้อนรับ <strong>'+(user.displayName||email)+'</strong>');
  gb.style.display='none'; go.style.display='flex';
  document.getElementById('note').textContent='แนะนำ: เพิ่มแอพไว้ที่หน้าจอโฮมเพื่อเปิดใช้งานได้สะดวก';
}

async function init(){
  if(!token){ err('ลิงก์เชิญไม่ถูกต้อง'); return; }
  if(inAppBrowser()){
    show('s-err','⚠️ กรุณาเปิดลิงก์นี้ในเบราว์เซอร์ของเครื่อง<br><span style="font-size:13px">กดเมนู ⋮ หรือ ⋯ มุมขวาบน แล้วเลือก<br><b>เปิดในเบราว์เซอร์</b> (Safari / Chrome)</span>');
    return;
  }
  try{
    await persistenceReady;
    const snap=await getDoc(doc(db,'invites',token));
    if(!snap.exists()){ err('ลิงก์เชิญนี้ถูกใช้งานแล้ว หรือไม่ถูกต้อง'); return; }
    invite=snap.data();
    const exp=invite.expiresAt?.toDate?.();
    if(exp && new Date()>exp){ err('ลิงก์เชิญหมดอายุแล้ว กรุณาขอลิงก์ใหม่จาก Admin'); return; }
    if(invite.name && invite.name!=='ไม่ระบุ') document.getElementById('invitee').textContent='ขอเรียนเชิญ '+invite.name;
    const roleTh={admin:'ผู้ดูแลระบบ (Admin)',editor:'ผู้แก้ไข (Editor)',viewer:'ผู้ดู (Viewer)'}[invite.role]||invite.role;

    // กลับมาจากหน้า Google (กรณีใช้ redirect)
    const rr=await getRedirectResult(auth).catch(()=>null);
    if(rr && rr.user){ await join(rr.user); return; }

    show('s-ok','✅ ลิงก์เชิญถูกต้อง<br>สิทธิ์: <strong>'+roleTh+'</strong><br><span style="font-size:13px">กดปุ่มด้านล่างเพื่อยืนยันตัวตน</span>');
    gb.style.display='flex';
  }catch(e){ err('เกิดข้อผิดพลาด: '+e.message); }
}

window.loginGoogle=async()=>{
  if(busy) return; busy=true; gb.disabled=true;
  try{
    const r=await signInWithPopup(auth,provider);
    await join(r.user);
  }catch(e){
    if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'){ busy=false; gb.disabled=false; return; }
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
      try{ await signInWithRedirect(auth,provider); return; }catch(e2){ e=e2; }
    }
    if(String(e.message).includes('permission')) err('บันทึกไม่สำเร็จ: ไม่มีสิทธิ์<br><span style="font-size:12px">ลิงก์อาจหมดอายุหรือถูกใช้แล้ว</span>');
    else err('เกิดข้อผิดพลาด: '+(e.code||e.message));
  }
};
init();
</script>
</body>
</html>

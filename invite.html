<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลิงก์เชิญ — ปฏิทินหลวงพ่อ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0ebe0;--surface:#faf7f0;--border:#d4c9a8;--gold2:#c9973a;--brown:#3d2e10;--brown2:#6b5a3e;--text3:#9c8a68;--green:#3d6b35;--red:#c0392b;--radius:16px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border-radius:28px;border:1px solid var(--border);padding:36px 28px;width:380px;max-width:95vw;text-align:center;box-shadow:0 8px 32px rgba(61,46,16,.1)}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#8b6914);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;border:3px solid #e8c56a;box-shadow:0 4px 16px rgba(184,134,11,.25)}
.app-name{font-size:20px;font-weight:800;color:var(--brown);margin-bottom:4px}
.status-box{border-radius:10px;padding:16px;margin:20px 0;font-size:14px;line-height:1.7}
.status-checking{background:#fdf8ee;border:1px solid #e8d9a0;color:var(--brown2)}
.status-ok{background:#f0f8ee;border:1px solid #b8d4b0;color:#2a5024}
.status-err{background:#fdf0f0;border:1px solid #e8a0a0;color:#8b2020}
.google-btn{width:100%;padding:14px;background:#3d3222;color:#e8c56a;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;display:none;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 10px rgba(61,50,34,.25)}
.google-btn img{width:20px;height:20px}
.go-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo-circle">🏛️</div>
  <div class="app-name">ปฏิทินหลวงพ่อ</div>
  <div class="status-box status-checking" id="status-box">⏳ กำลังตรวจสอบลิงก์เชิญ...</div>
  <button class="google-btn" id="google-btn" onclick="loginGoogle()" style="display:none">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    เข้าสู่ระบบด้วย Google เพื่อยืนยัน
  </button>
  <button class="go-btn" id="go-btn" onclick="window.location.href='index.html'">เข้าใช้งานปฏิทิน →</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAZeMTn0aihwl_LaKJ7UHTDepEWtHkRauo",authDomain:"luangpor-calendar.firebaseapp.com",projectId:"luangpor-calendar",storageBucket:"luangpor-calendar.firebasestorage.app",messagingSenderId:"575348458305",appId:"1:575348458305:web:d7e43e154df855d54357c0"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();
const params=new URLSearchParams(window.location.search);
const token=params.get('token');
const role=params.get('role')||'editor';
let inviteData=null;
const sb=document.getElementById('status-box');
const gb=document.getElementById('google-btn');
const goBtn=document.getElementById('go-btn');

function showErr(msg){sb.className='status-box status-err';sb.innerHTML='❌ '+msg;}

async function init(){
  if(!token){showErr('ลิงก์เชิญไม่ถูกต้องหรือหมดอายุแล้ว');return;}
  try{
    const snap=await getDoc(doc(db,'invites',token));
    if(!snap.exists()){showErr('ลิงก์เชิญนี้ถูกใช้งานแล้วหรือไม่ถูกต้อง');return;}
    inviteData=snap.data();
    const now=new Date();
    if(inviteData.expiresAt?.toDate&&now>inviteData.expiresAt.toDate()){showErr('ลิงก์เชิญหมดอายุแล้ว กรุณาติดต่อ Admin');return;}
    sb.className='status-box status-ok';
    sb.innerHTML='✅ ลิงก์เชิญถูกต้อง<br><strong>กรุณา Login ด้วย Google เพื่อเข้าระบบ</strong>';
    gb.style.display='flex';
  }catch(e){showErr('เกิดข้อผิดพลาด: '+e.message);}
}

window.loginGoogle=async()=>{
  gb.disabled=true;gb.textContent='กำลังเข้าสู่ระบบ...';
  try{
    const result=await signInWithPopup(auth,provider);
    const user=result.user;
    await setDoc(doc(db,'members',user.email.toLowerCase()),{name:user.displayName,email:user.email.toLowerCase(),role:inviteData.role||role,active:true,addedAt:serverTimestamp(),photoURL:user.photoURL||''});
    await deleteDoc(doc(db,'invites',token));
    sb.className='status-box status-ok';
    sb.innerHTML='🎉 เข้าร่วมสำเร็จ!<br>ยินดีต้อนรับ <strong>'+user.displayName+'</strong>';
    gb.style.display='none';goBtn.style.display='block';
  }catch(e){showErr('เกิดข้อผิดพลาด: '+e.message);gb.disabled=false;gb.innerHTML='<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> เข้าสู่ระบบด้วย Google';}
};
init();
</script>
</body>
</html>

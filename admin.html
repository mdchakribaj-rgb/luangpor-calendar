<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ปฏิทินหลวงพ่อ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0ebe0;--surface:#faf7f0;--surface2:#f0ebe0;--border:#d4c9a8;--gold:#b8860b;--gold2:#c9973a;--gold-light:#e8c56a;--brown:#3d2e10;--brown2:#6b5a3e;--brown3:#8c7a52;--green:#3d6b35;--red:#c0392b;--text:#2c1f0a;--text2:#6b5a3e;--text3:#9c8a68;--radius:14px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--surface);border-bottom:2px solid var(--gold2);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:54px;box-shadow:0 2px 8px rgba(61,46,16,.08)}
.logo{font-size:15px;font-weight:800;color:var(--brown)}
.logo span{color:var(--gold2)}
.topbar-right{display:flex;align-items:center;gap:10px}
.back-btn{padding:7px 16px;background:#3d3222;color:#e8c56a;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif}
.logout-btn{padding:7px 16px;background:var(--surface2);color:var(--brown2);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif}
.container{max-width:700px;margin:0 auto;padding:20px 16px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(61,46,16,.06)}
.section-title{font-size:16px;font-weight:700;color:var(--brown);margin-bottom:6px}
.section-desc{font-size:13px;color:var(--text3);margin-bottom:16px;line-height:1.6}
.fl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.fi{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--brown);font-family:'Sarabun',sans-serif;font-size:14px;outline:none}
.fi:focus{border-color:var(--gold2);background:var(--surface)}
.fg{margin-bottom:14px}
.role-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.role-opt{padding:9px 8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;text-align:center;background:var(--surface2);color:var(--text2);transition:all .15s}
.role-opt.active{border-color:var(--gold2);background:rgba(184,134,11,.1);color:var(--brown)}
.btn-gold{width:100%;padding:12px;background:#3d3222;color:#e8c56a;border:none;border-radius:var(--radius-sm);font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 10px rgba(61,50,34,.25)}
.btn-secondary{width:100%;padding:11px;background:var(--surface2);color:var(--brown2);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'Sarabun',sans-serif;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.link-box{display:none;margin-top:14px;background:#fdf8ee;border:1px solid #e8d9a0;border-radius:var(--radius-sm);padding:14px}
.link-text{font-size:12px;color:var(--brown);word-break:break-all;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;font-family:monospace;line-height:1.6}
.link-actions{display:flex;gap:8px}
.copy-btn{flex:1;padding:9px;background:#3d3222;color:#e8c56a;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif}
.line-btn{flex:1;padding:9px;background:#00b900;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif}
.link-expire{font-size:11px;color:var(--text3);margin-top:8px}
.member-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px}
.member-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#8b6914);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1}
.member-name{font-size:14px;font-weight:600;color:var(--brown)}
.member-email{font-size:11px;color:var(--text3);margin-top:1px}
.role-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.role-admin{background:rgba(184,134,11,.15);color:#7a5c00;border:1px solid rgba(184,134,11,.3)}
.role-editor{background:rgba(61,107,53,.12);color:#2a5024;border:1px solid rgba(61,107,53,.3)}
.role-viewer{background:rgba(26,74,138,.08);color:#1a4a8a;border:1px solid rgba(26,74,138,.2)}
.remove-btn{padding:5px 12px;background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.25);border-radius:6px;font-size:12px;cursor:pointer;font-family:'Sarabun',sans-serif}
.empty-state{text-align:center;padding:20px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;display:none;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user-name-top{font-size:13px;color:var(--brown2)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">ปฏิทิน<span>หลวงพ่อ</span> — Admin</div>
  <div class="topbar-right">
    <span class="user-name-top" id="user-name"></span>
    <button class="back-btn" onclick="window.location.href='index.html'">← กลับปฏิทิน</button>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<div class="container">
  <div class="section">
    <div class="section-title">🔗 สร้างลิงก์เชิญสมาชิก</div>
    <div class="section-desc">ลิงก์จะใช้ได้เพียงครั้งเดียวเท่านั้น เมื่อสมาชิก Login สำเร็จลิงก์จะหมดอายุทันที</div>
    <div class="fg"><label class="fl">ชื่อผู้รับเชิญ</label><input class="fi" type="text" id="invite-name" placeholder="เช่น พระอานนท์, โยมสมชาย"></div>
    <div class="fg">
      <label class="fl">สิทธิ์การใช้งาน</label>
      <div class="role-row">
        <div class="role-opt" onclick="setRole('viewer',this)">👁 Viewer<br><span style="font-size:10px;font-weight:400">ดูอย่างเดียว</span></div>
        <div class="role-opt active" onclick="setRole('editor',this)">✏️ Editor<br><span style="font-size:10px;font-weight:400">เพิ่ม/แก้ไขได้</span></div>
        <div class="role-opt" onclick="setRole('admin',this)">⚙️ Admin<br><span style="font-size:10px;font-weight:400">จัดการทั้งหมด</span></div>
      </div>
    </div>
    <button class="btn-gold" onclick="generateLink()">🔗 สร้างลิงก์เชิญ</button>
    <div class="link-box" id="link-box">
      <div style="font-size:12px;font-weight:600;color:var(--brown2);margin-bottom:8px">ลิงก์เชิญ (ใช้ได้ครั้งเดียว)</div>
      <div class="link-text" id="link-text"></div>
      <div class="link-actions">
        <button class="copy-btn" onclick="copyLink()">📋 Copy ลิงก์</button>
        <button class="line-btn" onclick="shareViaLine()">💬 ส่งผ่าน Line</button>
      </div>
      <div class="link-expire" id="link-expire"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">👥 สมาชิกทั้งหมด</div>
    <div class="section-desc">จัดการสมาชิกที่มีสิทธิ์เข้าใช้งานปฏิทิน</div>
    <div id="members-list"><div class="empty-state">⏳ กำลังโหลด...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyAZeMTn0aihwl_LaKJ7UHTDepEWtHkRauo",
  authDomain:"luangpor-calendar.firebaseapp.com",
  projectId:"luangpor-calendar",
  storageBucket:"luangpor-calendar.firebasestorage.app",
  messagingSenderId:"575348458305",
  appId:"1:575348458305:web:d7e43e154df855d54357c0"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null,selectedRole='editor',currentLink='';
const BASE_URL=window.location.origin+window.location.pathname.replace('admin.html','');

onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href='login.html';return;}
  const snap=await getDoc(doc(db,'members',user.email.toLowerCase()));
  if(!snap.exists()||snap.data().role!=='admin'){alert('ไม่มีสิทธิ์เข้าหน้านี้');window.location.href='index.html';return;}
  currentUser=user;
  document.getElementById('user-name').textContent=user.displayName||user.email;
  loadMembers();
});

window.setRole=(role,el)=>{
  selectedRole=role;
  document.querySelectorAll('.role-opt').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
};
window.generateLink=async()=>{
  const token=crypto.randomUUID();
  const name=document.getElementById('invite-name').value.trim();
  const expiresAt=new Date(Date.now()+7*24*60*60*1000);
  await setDoc(doc(db,'invites',token),{role:selectedRole,name:name||'ไม่ระบุ',createdBy:currentUser.email,createdAt:serverTimestamp(),expiresAt,used:false});
  currentLink=BASE_URL+'invite.html?token='+token+'&role='+selectedRole;
  document.getElementById('link-text').textContent=currentLink;
  document.getElementById('link-expire').textContent='⏰ หมดอายุ: '+expiresAt.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})+' · ใช้ได้ครั้งเดียว';
  document.getElementById('link-box').style.display='block';
  showToast('✅ สร้างลิงก์เรียบร้อย');
};
window.copyLink=()=>{navigator.clipboard.writeText(currentLink);showToast('📋 Copy ลิงก์แล้ว');};
window.shareViaLine=()=>{
  const name=document.getElementById('invite-name').value.trim()||'ท่าน';
  const msg=encodeURIComponent('🏛️ ปฏิทินหลวงพ่อ\n\nขอเรียนเชิญ '+name+' เข้าร่วมระบบ\n\n'+currentLink+'\n\n⚠️ ลิงก์นี้ใช้ได้เพียงครั้งเดียว');
  window.open('https://line.me/R/share?text='+msg,'_blank');
};
async function loadMembers(){
  const list=document.getElementById('members-list');
  try{
    const snap=await getDocs(collection(db,'members'));
    if(snap.empty){list.innerHTML='<div class="empty-state">ยังไม่มีสมาชิก</div>';return;}
    list.innerHTML='';
    snap.forEach(d=>{
      const m=d.data();
      const initials=(m.name||m.email).slice(0,2).toUpperCase();
      const roleCls=m.role==='admin'?'role-admin':m.role==='editor'?'role-editor':'role-viewer';
      const roleLbl=m.role==='admin'?'Admin':m.role==='editor'?'Editor':'Viewer';
      const isMe=m.email===currentUser.email.toLowerCase();
      const row=document.createElement('div');row.className='member-row';
      row.innerHTML=`
        <div class="member-avatar">${m.photoURL?`<img src="${m.photoURL}">`:`${initials}`}</div>
        <div class="member-info">
          <div class="member-name">${m.name||'-'}${isMe?' <span style="font-size:11px;color:var(--text3)">(คุณ)</span>':''}</div>
          <div class="member-email">${m.email}</div>
        </div>
        <span class="role-badge ${roleCls}">${roleLbl}</span>
        ${!isMe?`<button class="remove-btn" onclick="removeMember('${m.email}')">ลบ</button>`:''}`;
      list.appendChild(row);
    });
  }catch(e){list.innerHTML='<div class="empty-state">เกิดข้อผิดพลาด: '+e.message+'</div>';}
}
window.removeMember=async email=>{
  if(!confirm('ลบ '+email+' ออกจากระบบ?'))return;
  await deleteDoc(doc(db,'members',email));
  showToast('🗑️ ลบสมาชิกแล้ว');
  loadMembers();
};
window.logout=async()=>{await signOut(auth);window.location.href='login.html';};
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ปฏิทินหลวงพ่อ — เข้าสู่ระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ebe0;
  --surface: #faf7f0;
  --surface2: #f0ebe0;
  --border: #d4c9a8;
  --gold: #b8860b;
  --gold2: #c9973a;
  --gold-light: #e8c56a;
  --brown: #3d2e10;
  --brown2: #6b5a3e;
  --brown3: #8c7a52;
  --green: #3d6b35;
  --text: #2c1f0a;
  --text2: #6b5a3e;
  --text3: #9c8a68;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* BG PATTERN */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle at 20% 20%, rgba(184,134,11,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(61,107,53,.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: var(--surface);
  border-radius: 28px;
  border: 1px solid var(--border);
  padding: 40px 32px 36px;
  box-shadow: 0 8px 40px rgba(61,46,16,.12), 0 2px 8px rgba(61,46,16,.08);
  display: flex; flex-direction: column; align-items: center;
}

/* LOGO */
.logo-wrap {
  width: 110px; height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c9973a, #8b6914);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(184,134,11,.3), 0 0 0 4px #f5ead0, 0 0 0 6px #d4c9a8;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.logo-inner {
  width: 88px; height: 88px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f5ead0, #e8c56a);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
}
/* Thai border pattern */
.logo-wrap::after {
  content: '';
  position: absolute; inset: 6px;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,.4);
}

.app-name {
  font-size: 26px; font-weight: 800;
  color: var(--brown); letter-spacing: -.3px;
  margin-bottom: 4px;
}
.app-sub {
  font-size: 13px; color: var(--text3);
  margin-bottom: 32px; text-align: center;
  line-height: 1.5;
}

/* LOGIN BOX */
.login-box { width: 100%; }

.google-btn {
  width: 100%; padding: 15px 20px;
  background: #3d3222;
  color: #e8c56a;
  border: none; border-radius: var(--radius-sm);
  font-family: 'Sarabun', sans-serif;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: all .2s;
  box-shadow: 0 3px 12px rgba(61,50,34,.3);
}
.google-btn:hover {
  background: #4d3f2a;
  transform: translateY(-1px);
  box-shadow: 0 5px 16px rgba(61,50,34,.35);
}
.google-btn:active { transform: translateY(0); }
.google-btn img { width: 22px; height: 22px; }
.google-btn.loading { opacity: .7; pointer-events: none; }

.status-msg {
  display: none; width: 100%;
  border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 13px;
  margin-top: 12px; text-align: center; line-height: 1.6;
}
.status-loading { background: #fdf8ee; border: 1px solid #e8c56a; color: var(--brown2); }
.status-error { background: #fdf0f0; border: 1px solid #e8a0a0; color: #8b2020; }

.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0;
}
.div-line { flex: 1; height: 1px; background: var(--border); }
.div-text { font-size: 12px; color: var(--text3); white-space: nowrap; }

.invite-box {
  background: #f0f7ee;
  border: 1px solid #c8dfc4;
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex; align-items: flex-start; gap: 10px;
}
.invite-icon { font-size: 18px; flex-shrink: 0; }
.invite-text { font-size: 12px; color: #3d6b35; line-height: 1.7; }
.invite-text strong { color: #2a4d24; font-weight: 700; }

.footer {
  margin-top: 24px;
  font-size: 11px; color: var(--text3);
  text-align: center; line-height: 1.8;
}

/* DESKTOP */
@media (min-width: 768px) {
  .card {
    max-width: 860px;
    flex-direction: row;
    align-items: center;
    gap: 48px;
    padding: 48px;
  }
  .logo-wrap { width: 140px; height: 140px; flex-shrink: 0; margin-bottom: 0; }
  .logo-inner { width: 112px; height: 112px; font-size: 56px; }
  .right-col { flex: 1; }
  .app-name { font-size: 30px; }
  .app-sub { text-align: left; }
  .footer { text-align: left; }
}

/* float animation */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.logo-wrap { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-inner">🏛️</div>
  </div>
  <div class="right-col">
    <div class="app-name">ปฏิทินหลวงพ่อ</div>
    <div class="app-sub">ระบบจัดการตารางงาน<br>สำหรับสมาชิกที่ได้รับอนุญาตเท่านั้น</div>
    <div class="login-box">
      <button class="google-btn" id="google-btn" onclick="loginGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        เข้าสู่ระบบด้วย Google
      </button>
      <div class="status-msg status-loading" id="msg-loading">⏳ กำลังตรวจสอบสิทธิ์...</div>
      <div class="status-msg status-error" id="msg-error"></div>
      <div class="divider">
        <div class="div-line"></div>
        <div class="div-text">ยังไม่ได้รับการเชิญ?</div>
        <div class="div-line"></div>
      </div>
      <div class="invite-box">
        <span class="invite-icon">🔒</span>
        <div class="invite-text">
          ระบบนี้เปิดเฉพาะ<strong>ผู้ที่ได้รับลิงก์เชิญจาก Admin</strong> เท่านั้น<br>
          หากมีลิงก์เชิญ กรุณากดลิงก์นั้นก่อนแล้วค่อย Login
        </div>
      </div>
    </div>
    <div class="footer">ปฏิทินหลวงพ่อ · ระบบปลอดภัย เฉพาะสมาชิก<br>© 2568 สงวนลิขสิทธิ์</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZeMTn0aihwl_LaKJ7UHTDepEWtHkRauo",
  authDomain: "luangpor-calendar.firebaseapp.com",
  projectId: "luangpor-calendar",
  storageBucket: "luangpor-calendar.firebasestorage.app",
  messagingSenderId: "575348458305",
  appId: "1:575348458305:web:d7e43e154df855d54357c0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, async user => {
  if (user) {
    showLoading('⏳ กำลังตรวจสอบสิทธิ์...');
    const ok = await checkWhitelist(user.email);
    if (ok) { window.location.href = 'index.html'; }
    else { await signOut(auth); hideLoading(); }
  }
});

async function checkWhitelist(email) {
  try {
    const snap = await getDoc(doc(db, 'members', email.toLowerCase()));
    return snap.exists() && snap.data().active === true;
  } catch { return false; }
}

function showLoading(msg) {
  document.getElementById('google-btn').classList.add('loading');
  document.getElementById('msg-loading').textContent = msg;
  document.getElementById('msg-loading').style.display = 'block';
  document.getElementById('msg-error').style.display = 'none';
}
function hideLoading() {
  document.getElementById('google-btn').classList.remove('loading');
  document.getElementById('msg-loading').style.display = 'none';
}
function showError(msg) {
  hideLoading();
  const el = document.getElementById('msg-error');
  el.innerHTML = '❌ ' + msg;
  el.style.display = 'block';
}

window.loginGoogle = async function() {
  showLoading('⏳ กำลังเชื่อมต่อ Google...');
  try {
    const result = await signInWithPopup(auth, provider);
    showLoading('⏳ กำลังตรวจสอบสิทธิ์...');
    const ok = await checkWhitelist(result.user.email);
    if (ok) { window.location.href = 'index.html'; }
    else {
      await signOut(auth);
      showError('บัญชีนี้ไม่มีสิทธิ์เข้าใช้งาน<br>กรุณาติดต่อ Admin เพื่อขอลิงก์เชิญ');
    }
  } catch(e) {
    if (e.code === 'auth/popup-closed-by-user') hideLoading();
    else showError('เกิดข้อผิดพลาด: ' + (e.message || 'กรุณาลองใหม่'));
  }
};
</script>
</body>
</html>
